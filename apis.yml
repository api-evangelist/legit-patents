name: Legit Patents
description: >-
  Legit (listed by Seedcamp as "Legit Patents", 2016 cohort, legit.ai) was a
  Cambridge, Massachusetts startup applying natural-language processing to
  scientific and patent literature, which it developed into an on-demand expert
  network for the life sciences. Its product let pharmaceutical, biotech and
  medical-device teams search a corpus the company described as more than two
  million experts backed by roughly forty million data points, then pay a flat
  fee per reply to message key opinion leaders directly instead of scheduling
  calls — marketed for R&D, business development and licensing (BD&L),
  strategic alliances and integration management. The company is no longer
  operating: substantive legit.ai content disappears from the web archive after
  2021, its LinkedIn company page returns HTTP 404, and the legit.ai domain is
  now parked on GoDaddy/Afternic and listed for sale (Afternic nameservers, a
  null MX record and an SPF "-all" policy). No public API, developer portal,
  documentation or machine-readable specification was ever published; see
  review.yml for the full probe record.
